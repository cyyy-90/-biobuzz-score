<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIOBUZZ 中文計分器 V1.3.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:white;padding:16px;text-align:center;position:sticky;top:0;z-index:5}
h1{margin:0;font-size:22px} .sub{font-size:12px;opacity:.75;margin-top:4px}
.wrap{max-width:900px;margin:auto;padding:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:white;border-radius:16px;padding:14px;box-shadow:0 2px 10px #00000012;margin-bottom:12px}
.red{border-top:6px solid #ef4444}.blue{border-top:6px solid #3b82f6}
h2{margin:2px 0 10px;font-size:18px}
h3{margin:12px 0 8px;font-size:15px}
.score{font-size:34px;font-weight:800;text-align:center;margin:4px 0 12px}
button{border:0;border-radius:11px;padding:11px 12px;margin:4px;cursor:pointer;font-weight:700;font-size:14px}
button:active{transform:scale(.97)}
.redbtn{background:#fee2e2;color:#991b1b}.bluebtn{background:#dbeafe;color:#1e40af}
.yellowbtn{background:#fef3c7;color:#92400e}.graybtn{background:#e5e7eb;color:#374151}
.greenbtn{background:#dcfce7;color:#166534}
.row{display:flex;flex-wrap:wrap;gap:3px}
.stat{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #eee;font-size:14px}
.rp{font-size:20px;font-weight:800}
.shared{border-top:6px solid #f59e0b}
.flower{background:#fafafa;border:1px solid #e5e7eb;border-radius:12px;padding:10px;margin:8px 0}
.flower-title{font-weight:800;margin-bottom:5px}
.sequence{min-height:34px;background:white;border-radius:8px;padding:7px;font-size:13px}
.piece{display:inline-block;padding:5px 7px;border-radius:7px;margin:2px;font-weight:700}
.piece.r{background:#fee2e2;color:#991b1b}.piece.b{background:#dbeafe;color:#1e40af}.piece.p{background:#fef3c7;color:#92400e}
.summary{font-size:13px;color:#4b5563;margin-top:5px}
.full{grid-column:1/-1}
.finish{width:100%;font-size:17px;padding:14px;background:#111827;color:white}
.reset{width:100%;font-size:15px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style>
</head>
<body>
<header>
  <h1>🐝 BIOBUZZ™ 中文計分器</h1>
  <div class="sub">V1.3.1｜FLOWER 共用順序修正版</div>
</header>

<div class="wrap">
<div class="grid">

<section class="card red">
<h2>🔴 紅方</h2>
<div class="score" id="redScore">0</div>
<h3>AUTO</h3>
<div class="row">
<button class="redbtn" onclick="add('red','autoLeave',3)">LEAVE +3</button>
<button class="redbtn" onclick="add('red','autoPark',5)">AUTO PARK +5</button>
</div>
<h3>HIVE</h3>
<div class="row">
<button class="redbtn" onclick="hiveTip('red')">HIVE TIP +20</button>
<button class="graybtn" onclick="add('red','hiveRemain',2)">剩餘 POLLEN/NECTAR +2</button>
</div>
<h3>TELEOP</h3>
<div class="row">
<button class="redbtn" onclick="add('red','teleopPark',5)">PARK +5</button>
</div>
<h3>GARDEN</h3>
<div class="row">
<button class="redbtn" onclick="add('red','garden',1)">POLLEN/NECTAR +1</button>
</div>
</section>

<section class="card blue">
<h2>🔵 藍方</h2>
<div class="score" id="blueScore">0</div>
<h3>AUTO</h3>
<div class="row">
<button class="bluebtn" onclick="add('blue','autoLeave',3)">LEAVE +3</button>
<button class="bluebtn" onclick="add('blue','autoPark',5)">AUTO PARK +5</button>
</div>
<h3>HIVE</h3>
<div class="row">
<button class="bluebtn" onclick="hiveTip('blue')">HIVE TIP +20</button>
<button class="graybtn" onclick="add('blue','hiveRemain',2)">剩餘 POLLEN/NECTAR +2</button>
</div>
<h3>TELEOP</h3>
<div class="row">
<button class="bluebtn" onclick="add('blue','teleopPark',5)">PARK +5</button>
</div>
<h3>GARDEN</h3>
<div class="row">
<button class="bluebtn" onclick="add('blue','garden',1)">POLLEN/NECTAR +1</button>
</div>
</section>

<section class="card shared full">
<h2>🌼 FLOWER（場上共用 4 個）</h2>
<div class="summary">每個 FLOWER 都按照「實際放入順序」記錄，紅藍方共用同一個堆疊。</div>
<div id="flowers"></div>
</section>

<section class="card full">
<h2>📊 比賽結果</h2>
<div class="stat"><span>🔴 紅方</span><strong id="redDetail">0</strong></div>
<div class="stat"><span>🔵 藍方</span><strong id="blueDetail">0</strong></div>
<div class="stat"><span>🏆 勝負</span><strong id="winner">尚未結算</strong></div>
<div class="stat"><span>⭐ 紅方 RP</span><strong class="rp" id="redRP">0</strong></div>
<div class="stat"><span>⭐ 藍方 RP</span><strong class="rp" id="blueRP">0</strong></div>
<button class="finish" onclick="finishMatch()">🏁 結束比賽／正式結算</button>
<button class="graybtn reset" onclick="resetAll()">↺ 全部重置</button>
</section>

</div>
</div>

<script>
const state={
 red:{autoLeave:0,autoPark:0,teleopPark:0,hiveTips:0,hiveRemain:0,garden:0,flowerBonus:0},
 blue:{autoLeave:0,autoPark:0,teleopPark:0,hiveTips:0,hiveRemain:0,garden:0,flowerBonus:0},
 // IMPORTANT: one shared chronological sequence for each physical FLOWER.
 flowers:[[],[],[],[]],
 finished:false
};

function add(team,key,points){
 state[team][key]++;
 render();
}

function hiveTip(team){
 state[team].hiveTips++;
 render();
}

function addFlower(i,type){
 state.flowers[i].push(type);
 recalcFlowerBonus();
 render();
}

function clearFlower(i){
 state.flowers[i]=[];
 recalcFlowerBonus();
 render();
}

function recalcFlowerBonus(){
 state.red.flowerBonus=0;
 state.blue.flowerBonus=0;

 for(const seq of state.flowers){
   // FLOWER bonus: bottom NECTAR gives +5 to its owner.
   // Owner is determined by the bottommost NECTAR in the true shared sequence.
   const nectar=seq.find(x=>x==='R'||x==='B');
   if(nectar==='R') state.red.flowerBonus+=5;
   if(nectar==='B') state.blue.flowerBonus+=5;

   // Owner gets +2 for every POLLEN/NECTAR in that FLOWER.
   // Ownership follows the bottommost NECTAR; if none exists yet, no owner bonus.
   if(nectar==='R') state.red.flowerBonus += seq.length*2;
   if(nectar==='B') state.blue.flowerBonus += seq.length*2;
 }
}

function baseScore(team){
 const s=state[team];
 return s.autoLeave*3+s.autoPark*5+s.teleopPark*5+s.hiveTips*20+s.hiveRemain*2+s.garden+ s.flowerBonus;
}

function totalScore(team){return baseScore(team)}

function rp(team,other){
 const s=state[team], o=state[other];
 let r=0;
 if(state.finished){
   const a=totalScore(team), b=totalScore(other);
   if(a>b) r+=3;
   else if(a===b) r+=1;
 }
 // All Other Events achievement RPs:
 if((s.autoLeave*3)+(s.autoPark*5)+(s.teleopPark*5)>=16) r+=1; // SWARM
 if(s.hiveTips>=4) r+=1; // POLLINATOR 1
 if(s.hiveTips>=7) r+=1; // POLLINATOR 2
 return r;
}

function render(){
 recalcFlowerBonus();
 document.getElementById('redScore').textContent=totalScore('red');
 document.getElementById('blueScore').textContent=totalScore('blue');
 document.getElementById('redDetail').textContent=totalScore('red');
 document.getElementById('blueDetail').textContent=totalScore('blue');
 document.getElementById('redRP').textContent=rp('red','blue');
 document.getElementById('blueRP').textContent=rp('blue','red');

 let w='尚未結算';
 if(state.finished){
   const r=totalScore('red'), b=totalScore('blue');
   w=r>b?'🔴 紅方勝':b>r?'🔵 藍方勝':'🤝 平手';
 }
 document.getElementById('winner').textContent=w;

 const box=document.getElementById('flowers');
 box.innerHTML='';
 state.flowers.forEach((seq,i)=>{
   const div=document.createElement('div');
   div.className='flower';
   const labels={R:'🔴 Red NECTAR',B:'🔵 Blue NECTAR',P:'🟡 POLLEN'};
   const pieces=seq.length?seq.map(x=>`<span class="piece ${x.toLowerCase()}">${labels[x]}</span>`).join(''):'尚未放入';
   const owner=seq.find(x=>x==='R'||x==='B');
   const ownerText=owner==='R'?'紅方':owner==='B'?'藍方':'尚未決定';
   div.innerHTML=`
     <div class="flower-title">FLOWER ${i+1}</div>
     <div class="sequence">${pieces}</div>
     <div class="summary">底部 → 頂部｜擁有者：${ownerText}</div>
     <div class="row">
       <button class="redbtn" onclick="addFlower(${i},'R')">🔴 Red NECTAR</button>
       <button class="bluebtn" onclick="addFlower(${i},'B')">🔵 Blue NECTAR</button>
       <button class="yellowbtn" onclick="addFlower(${i},'P')">🟡 POLLEN</button>
       <button class="graybtn" onclick="clearFlower(${i})">清除</button>
     </div>`;
   box.appendChild(div);
 });
}

function finishMatch(){
 state.finished=true;
 render();
}

function resetAll(){
 if(!confirm('確定要全部重置嗎？')) return;
 for(const t of ['red','blue']){
   for(const k of Object.keys(state[t])) state[t][k]=0;
 }
 state.flowers=[[],[],[],[]];
 state.finished=false;
 render();
}
render();
</script>
</body>
</html>
